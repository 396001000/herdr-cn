name: CI

# 汉化仓库自己的 CI：只做编译与单元测试，替代从上游继承来的 ci.yml
# （上游 ci.yml 是给上游 monorepo 用的，在汉化仓库里跑没意义）。
# 目的：上游 master 合并进来后，先在这里看出编译/测试是否被破坏。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check + test (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Install Zig
        # build.rs 的 vendored libghostty-vt 需要 zig（与构建流水线同款）
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-check
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - name: cargo check
        run: cargo check --locked --all-targets --bin herdr
      # 与上游 `just ci-tests` 同口径：用 nextest 跑（逐个进程隔离）。
      # 直接 cargo test 是多线程同进程，会让共享全局状态的 UI/选择/持久化用例
      # 互相干扰而误报失败（验证时 cargo test 挂 8 个，上游 nextest 全绿）。
      - name: cargo nextest
        env:
          CARGO_INCREMENTAL: 1
        run: |
          cargo nextest run --locked --status-level fail --final-status-level slow --failure-output final --success-output never
